worker_processes auto;

events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=movie_cache:100m max_size=5g inactive=7d use_temp_path=off;

    log_format cache_log '$remote_addr - [$time_local] "$request" $status '
                          'cache=$upstream_cache_status bytes_sent=$body_bytes_sent';

    access_log /dev/stdout cache_log;
    error_log /dev/stderr warn;

    # Populated from nginx/templates/default.conf.template — the nginx image's
    # entrypoint envsubst's ${STORAGE_ORIGIN} in there from this container's
    # environment (see docker-compose.yml) before nginx starts.
    include /etc/nginx/conf.d/*.conf;
}
