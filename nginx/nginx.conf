worker_processes auto;

events {
    # Each cache MISS holds two connections (viewer + storage origin) and HLS
    # players keep idle keep-alive connections open, so 1024 ran out early.
    worker_connections 8192;
}

http {
    # Do not advertise the exact nginx version in the Server header / error pages.
    server_tokens off;

    # Hand cached segment files straight from disk to the socket (sendfile),
    # fill whole packets before sending (tcp_nopush), and send the last packet
    # of each response without delay (tcp_nodelay). Not on by default here
    # because this file replaces the image's own nginx.conf.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Compress the TEXT media only: HLS playlists and WebVTT subtitles are
    # tens of KB of very repetitive text. Video segments (video/mp2t) and
    # images are already compressed and must never be listed here. nginx only
    # compresses when the player asks for it (Accept-Encoding: gzip), and it
    # tells browsers so with its own "Vary: Accept-Encoding" (gzip_vary).
    # Rendition playlists uploaded by the desktop transcoder are stored as
    # audio/mpegurl, the master and subtitle playlists as
    # application/vnd.apple.mpegurl, so both spellings are listed.
    gzip on;
    gzip_types application/vnd.apple.mpegurl application/x-mpegurl audio/mpegurl audio/x-mpegurl text/vtt;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;

    # proxy_cache_path (the movie_cache zone and its max_size) now lives in
    # templates/default.conf.template, next to
    # the locations that use it (max_size is a fixed number there).

    # Access-log path with the playback token masked: /s/<expires>/<signature>/...
    # becomes /s/<expires>/-/... so a copy of the log cannot be replayed to
    # play a title. $uri is the normalised path (percent-decoded, slashes
    # merged — the same string the /s/ locations match on), so every shape
    # the cache would actually serve is masked. The query string is appended
    # back so the line reads like the old "$request" one; the cache ignores it
    # and the backend never puts a token there. Only a request line nginx could
    # not parse at all (400) now logs blank instead of its raw bytes.
    map $uri $log_uri {
        ~^/s/(\d+)/[^/]+/(.*)$ /s/$1/-/$2;
        default $uri;
    }

    log_format cache_log '$remote_addr - [$time_local] "$request_method $log_uri$is_args$args $server_protocol" $status '
                          'cache=$upstream_cache_status bytes_sent=$body_bytes_sent';

    access_log /dev/stdout cache_log;
    # nginx's own error log has no masking hook: when the storage origin fails
    # or times out, the [error] line it writes here carries the raw request
    # line, token included (`request: "GET /s/<exp>/<sig>/..."`). Successful
    # requests never reach this log. Keep `warn` — `crit` would hide exactly
    # the upstream failures this log exists to show — and see README
    # ("What the logs hold") before shipping stderr anywhere.
    error_log /dev/stderr warn;

    # Populated from nginx/templates/default.conf.template — the nginx image's
    # entrypoint envsubst's ${STORAGE_ORIGIN} in there from this container's
    # environment (see docker-compose.yml) before nginx starts.
    include /etc/nginx/conf.d/*.conf;
}
