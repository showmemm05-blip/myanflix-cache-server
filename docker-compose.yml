services:
  # The "Flokinet (VPS) Cache Server" role: caches responses from the storage
  # origin so repeat requests for the same movie don't reach it (or its VPS
  # uplink) again. Deliberately standalone — the storage server
  # (../storage-server) is a separate service reached over the network, never
  # bundled into this compose project, matching the real two-VPS split.
  cache:
    image: nginx:alpine
    # Without this, a crash or host reboot leaves the service down until
    # someone notices and starts it by hand.
    restart: unless-stopped
    environment:
      # Local: MinIO published on the host machine (../storage-server),
      # reached via Docker's host.docker.internal. Real deployment: point
      # this at the Movie Storage Server VPS's own address instead — nothing
      # else here changes.
      STORAGE_ORIGIN: ${STORAGE_ORIGIN:-host.docker.internal:9000}
      # Verifies the /s/<expires>/<sig>/ token on every media URL — must be
      # the backend's STREAM_SIGNING_SECRET verbatim. `:?` makes compose
      # refuse to start the container when the value is unset OR empty. A
      # plain ${STREAM_SIGNING_SECRET} would not: compose passes an unset
      # variable through as "", envsubst renders `secure_link_md5 "$exp
      # $scope "`, and nginx starts happily accepting tokens anyone can
      # compute with the empty secret.
      STREAM_SIGNING_SECRET: ${STREAM_SIGNING_SECRET:?STREAM_SIGNING_SECRET must be set in cacheserver/.env (same value as backend/.env)}
      # Rollout switch for token-less video/audio/book URLs: "allow" while
      # old clients still hold plain links, "deny" (the default) once every
      # client fetches signed ones. Never-servable media is refused either
      # way — video and audio originals, subtitles/, documents/ and temp/ —
      # see the map at the top of nginx/templates/default.conf.template.
      LEGACY_UNSIGNED_MEDIA: ${LEGACY_UNSIGNED_MEDIA:-deny}
    # One access-log line per segment adds up fast: keep at most 5 files of
    # 50 MB (250 MB) instead of letting the log grow until the disk fills.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "${CACHE_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - cache-data:/var/cache/nginx
    extra_hosts:
      # host.docker.internal is automatic on Docker Desktop (macOS/Windows);
      # this makes it also resolve on Linux Docker engines.
      - "host.docker.internal:host-gateway"
    sysctls:
      # host.docker.internal can resolve to an IPv6 address that isn't
      # actually routable in this environment, causing intermittent
      # "Network unreachable" errors and forced retries mid-stream.
      # Disabling IPv6 in this container means DNS only ever returns the
      # (working) IPv4 address.
      - net.ipv6.conf.all.disable_ipv6=1

volumes:
  cache-data:
