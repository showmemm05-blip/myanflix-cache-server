services:
  # The "Flokinet (VPS) Cache Server" role: caches responses from the storage
  # origin so repeat requests for the same movie don't reach it (or its VPS
  # uplink) again. Deliberately standalone — the storage server
  # (../storage-server) is a separate service reached over the network, never
  # bundled into this compose project, matching the real two-VPS split.
  cache:
    image: nginx:alpine
    environment:
      # Local: MinIO published on the host machine (../storage-server),
      # reached via Docker's host.docker.internal. Real deployment: point
      # this at the Movie Storage Server VPS's own address instead — nothing
      # else here changes.
      STORAGE_ORIGIN: ${STORAGE_ORIGIN:-host.docker.internal:9000}
    ports:
      - "${CACHE_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - cache-data:/var/cache/nginx
    extra_hosts:
      # host.docker.internal is automatic on Docker Desktop (macOS/Windows);
      # this makes it also resolve on Linux Docker engines.
      - "host.docker.internal:host-gateway"
    sysctls:
      # host.docker.internal can resolve to an IPv6 address that isn't
      # actually routable in this environment, causing intermittent
      # "Network unreachable" errors and forced retries mid-stream.
      # Disabling IPv6 in this container means DNS only ever returns the
      # (working) IPv4 address.
      - net.ipv6.conf.all.disable_ipv6=1

volumes:
  cache-data:
